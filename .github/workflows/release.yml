name: Release

# Triggered by pushing a tag like v1.2.3. Builds Jot.app, bumps the Homebrew
# tap to point at it, and only THEN publishes the GitHub release — publishing
# first and bumping the tap after would leave a public release the in-app
# updater can't actually install if the tap bump fails partway (token,
# checkout, push), the same class of bug this whole pipeline exists to catch.
# Once published, install.sh and brew are each smoke-tested against that
# exact release on their own fresh runner, the way a real user would install.
#
# Verified end to end on a real GitHub-hosted macOS runner (v1.1.0,
# 2026-08-22): stable Xcode/macOS on the runner never hits the macOS 27 beta
# SDK mismatch build.sh's local toolchain lookup exists to work around.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      # A tag ahead of Info.plist ships an app that always sees the release
      # as newer than itself, so "Update Available" never goes away.
      - name: Check tag matches Info.plist
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw resources/Info.plist)"
          [ "v$VERSION" = "${{ github.ref_name }}" ] || {
            echo "::error::tag ${{ github.ref_name }} does not match Info.plist version $VERSION"
            exit 1
          }

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: ./build.sh

      - name: Package
        id: package
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw resources/Info.plist)"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent Jot.app "dist/Jot-$VERSION.zip"
          shasum -a 256 "dist/Jot-$VERSION.zip" > "dist/Jot-$VERSION.zip.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/Jot-$VERSION.zip.sha256")" >> "$GITHUB_OUTPUT"

      # Held here, not published yet: bump-homebrew-cask has to succeed
      # first. A different runner publishes it once that's confirmed.
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist/
          retention-days: 1

  # The in-app updater runs `brew upgrade --cask jot`, which only sees what
  # the tap says. This runs before the release is public, and nothing
  # publishes it until this succeeds — a tap left on the previous version
  # made every "Update Available" click a silent no-op, which is exactly
  # what 1.3.0 shipped with, and publishing first would only have moved that
  # same failure one step later instead of closing it.
  bump-homebrew-cask:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || {
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Add a fine-grained token with Contents: read and write on lsuryatej/homebrew-jot as a repository secret, then re-run this job."
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          repository: lsuryatej/homebrew-jot
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Point the cask at this release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        working-directory: tap
        run: |
          sed -i -E "s/^  version \".*\"$/  version \"$VERSION\"/" Casks/jot.rb
          sed -i -E "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" Casks/jot.rb
          grep -q "^  version \"$VERSION\"$" Casks/jot.rb && grep -q "^  sha256 \"$SHA256\"$" Casks/jot.rb || {
            echo "::error::cask edit did not apply"; cat Casks/jot.rb; exit 1
          }
          if git diff --quiet; then
            echo "Cask already at $VERSION."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "jot $VERSION"
          git push

  publish-release:
    needs: [build, bump-homebrew-cask]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/Jot-${{ needs.build.outputs.version }}.zip" \
            "dist/Jot-${{ needs.build.outputs.version }}.zip.sha256" \
            --title "Jot ${{ needs.build.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --generate-notes

  smoke-test-install-sh:
    needs: [build, publish-release]
    runs-on: macos-14
    steps:
      - name: Run install.sh exactly as a real user would
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh" | bash

      - name: Verify the installed app
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          APP="/Applications/Jot.app"

          test -d "$APP" || { echo "::error::$APP does not exist after install.sh"; exit 1; }
          test -x "$APP/Contents/MacOS/Jot" || { echo "::error::executable missing or not executable"; exit 1; }

          INSTALLED_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          [ "$INSTALLED_VERSION" = "$VERSION" ] || {
            echo "::error::installed version ($INSTALLED_VERSION) does not match the release ($VERSION)"
            exit 1
          }

          # Confirms the ad-hoc signature is intact and, separately, that
          # install.sh's quarantine strip actually took — a runner is a fresh
          # machine every time, so a leftover quarantine flag here would mean
          # a real Gatekeeper prompt for every first-time user, the same
          # class of bug the brew-path postflight fix (see
          # brew-smoke-test.yml) exists for on the Homebrew side.
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" || { echo "::error::unexpected code signature"; exit 1; }
          if xattr -l "$APP" 2>/dev/null | grep -q com.apple.quarantine; then
            echo "::error::app is quarantined after install.sh — first launch would show a Gatekeeper prompt"
            exit 1
          fi

          echo "install.sh installed Jot $VERSION correctly, unsigned-but-unquarantined, as intended."

  smoke-test-brew:
    needs: [build, publish-release]
    runs-on: macos-14
    steps:
      - name: Install via the real published command
        run: brew install lsuryatej/jot/jot

      - name: Verify it is this release
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          APP="/Applications/Jot.app"
          INSTALLED_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          [ "$INSTALLED_VERSION" = "$VERSION" ] || {
            echo "::error::brew installed $INSTALLED_VERSION, expected $VERSION"
            exit 1
          }
          if xattr -l "$APP" 2>/dev/null | grep -q com.apple.quarantine; then
            echo "::error::app is quarantined after brew install"
            exit 1
          fi
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" || { echo "::error::unexpected code signature"; exit 1; }
          echo "brew install lsuryatej/jot/jot gives $VERSION."

      - name: Clean up
        if: always()
        run: brew uninstall --cask jot || true
